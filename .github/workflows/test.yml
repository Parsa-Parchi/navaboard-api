name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: navaboard
          POSTGRES_PASSWORD: navaboard-test-only
          POSTGRES_DB: navaboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U navaboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-key-0123456789
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://navaboard:navaboard-test-only@127.0.0.1:5432/navaboard
      CACHE_URL: locmemcache://ci
      SMS_PROVIDER: console
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: python -m pip install -r requirements/base.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py spectacular --file schema.yml --validate --fail-on-warn
