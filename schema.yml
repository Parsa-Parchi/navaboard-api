      - created_at
      - created_by
      - current_user_role
      - id
      - name
      - updated_at
    WorkspaceRole:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
    WorkspaceWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
      required:
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
