                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/email/login/:
    post:
      operationId: auth_email_login_create
      description: |-
        For existing users who attached and verified email and set a password. Send email/password with credentials and X-CSRFToken. Returns access JSON and HttpOnly refresh cookie.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Sign in with optional verified email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordLoginRequest'
            example:
              email: parsa@example.com
              password: your-password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailPasswordLoginRequest'
            example:
              email: parsa@example.com
              password: your-password
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailPasswordLoginRequest'
            example:
              email: parsa@example.com
              password: your-password
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerificationResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        schema:
          type: string
        description: csrfToken returned by GET /api/auth/csrf/; include the browser
          cookies too.
  /api/auth/email/verification/request/:
    post:
      operationId: auth_email_verification_request_create
      description: |-
        Bearer token required. After phone login, send the email to attach. Code expires in ten minutes; the email is not changed until confirmation.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Request optional email verification
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
            example:
              email: parsa@example.com
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
            example:
              email: parsa@example.com
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
            example:
              email: parsa@example.com
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationRequestResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/email/verification/confirm/:
    post:
      operationId: auth_email_verification_confirm_create
      description: |-
        Bearer token required. Send the same email and its six-digit code. A code is bound to the requesting user and cannot be reused.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Attach verified email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
            example:
              email: parsa@example.com
              code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
            example:
              email: parsa@example.com
              code: '123456'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
            example:
              email: parsa@example.com
              code: '123456'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationConfirmResponse'
          description: ''
        '429':
