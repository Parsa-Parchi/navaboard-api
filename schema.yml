openapi: 3.0.3
info:
  title: NavaBoard API
  version: 0.1.0
  description: API documentation for the NavaBoard project.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Call before login, refresh or logout with credentials included.
        Send csrfToken in X-CSRFToken on those POST requests. The browser stores the
        CSRF cookie automatically.
      summary: Initialize browser CSRF protection
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenResponse'
          description: ''
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: |-
        First step for both registration and login. Send an Iranian mobile number (09121234567 or +989121234567). Code expires in two minutes. In development only, development_otp_code may be returned; otherwise delivery uses the configured SMS provider.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Request phone login code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
            example:
              phone_number: 09121234567
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
            example:
              phone_number: 09121234567
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
            example:
              phone_number: 09121234567
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: |-
        Send phone_number and six-digit code. First successful verification creates the user. JSON contains access, token_type and user; refresh is set only in an HttpOnly cookie. Include credentials and X-CSRFToken obtained from GET /api/auth/csrf/.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Verify phone code and sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerificationRequest'
            example:
              phone_number: 09121234567
              code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerificationRequest'
            example:
              phone_number: 09121234567
              code: '123456'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerificationRequest'
            example:
              phone_number: 09121234567
              code: '123456'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerificationResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        schema:
          type: string
        description: csrfToken returned by GET /api/auth/csrf/; include the browser
          cookies too.
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        POST with no body, credentials included and X-CSRFToken. Returns a new access token and rotates the HttpOnly refresh cookie; old refresh cannot be reused. An expired Authorization header is ignored. Serialize concurrent refresh requests in the frontend. Invalid/missing refresh returns 400; sign in again.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Rotate refresh cookie
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        schema:
          type: string
        description: csrfToken returned by GET /api/auth/csrf/; include the browser
          cookies too.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST with credentials and X-CSRFToken. Revokes this browser's refresh token and clears its cookie. Works with expired access tokens; repeated logout succeeds. Discard the frontend access token; issued access tokens expire normally.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Sign out this browser
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        schema:
          type: string
        description: csrfToken returned by GET /api/auth/csrf/; include the browser
          cookies too.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Bearer token required. GET reads profile; PATCH/PUT changes full_name. Phone/email/verification flags are read-only: use their verification endpoints.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Get current user profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
    put:
      operationId: auth_me_update
      description: |-
        Bearer token required. GET reads profile; PATCH/PUT changes full_name. Phone/email/verification flags are read-only: use their verification endpoints.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Update current user profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentUserProfileRequest'
            example:
              full_name: Parsa
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurrentUserProfileRequest'
            example:
              full_name: Parsa
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurrentUserProfileRequest'
            example:
              full_name: Parsa
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
    patch:
      operationId: auth_me_partial_update
      description: |-
        Bearer token required. GET reads profile; PATCH/PUT changes full_name. Phone/email/verification flags are read-only: use their verification endpoints.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Update current user profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
            example:
              full_name: Parsa
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
            example:
              full_name: Parsa
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileRequest'
            example:
              full_name: Parsa
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfile'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/phone/change/request/:
    post:
      operationId: auth_phone_change_request_create
      description: |-
        Bearer token required. Send the destination phone_number. Code is bound to the current user and new number.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Request new phone verification
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeRequestRequest'
            example:
              phone_number: 09121234568
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneChangeRequestRequest'
            example:
              phone_number: 09121234568
          multipart/form-data:
