components:
  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        full_name:
          type: string
        is_phone_verified:
          type: boolean
      required:
      - email
      - full_name
      - id
      - is_phone_verified
      - phone_number
    BoardDetailRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/BoardVisibility'
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        current_user_role:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lists:
          type: array
          items:
            $ref: '#/components/schemas/BoardListWithCardsRead'
          readOnly: true
      required:
      - created_at
      - created_by
      - current_user_role
      - id
      - lists
      - name
      - updated_at
      - workspace_id
    BoardListCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        position:
          type: integer
          minimum: 0
      required:
      - title
    BoardListMove:
      type: object
      properties:
        position:
          type: integer
          minimum: 0
      required:
      - position
    BoardListRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        board_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - board_id
      - created_at
      - id
      - position
      - title
      - updated_at
    BoardListWithCardsRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        board_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardRead'
          readOnly: true
      required:
      - board_id
      - cards
      - created_at
      - id
      - position
      - title
      - updated_at
    BoardMemberCreate:
      type: object
      properties:
        phone_number:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/WorkspaceAssignableRole'
          default: member
      required:
      - phone_number
    BoardMemberUser:
      type: object
      properties:
        id:
          type: string
