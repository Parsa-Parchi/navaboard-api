              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/phone/change/confirm/:
    post:
      operationId: auth_phone_change_confirm_create
      description: |-
        Bearer token required. Send the destination phone_number and code. The number must not belong to another user.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Confirm phone number change
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
            example:
              phone_number: 09121234568
              code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
            example:
              phone_number: 09121234568
              code: '123456'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
            example:
              phone_number: 09121234568
              code: '123456'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneChangeConfirmResponse'
          description: ''
        '429':
