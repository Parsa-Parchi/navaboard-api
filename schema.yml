  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Bearer token required. Supply current_password and new_password. Revokes sessions and clears the refresh cookie; sign in again.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Change login password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: old-password
              new_password: new-strong-password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: old-password
              new_password: new-strong-password
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: old-password
              new_password: new-strong-password
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottledResponse'
          description: ''
        '400':
          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/password/reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: |-
        Send account phone_number. A password-reset SMS code is generated for the active account.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
            example:
              phone_number: 09121234567
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
            example:
              phone_number: 09121234567
          multipart/form-data:
            schema:
