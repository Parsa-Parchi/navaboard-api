components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace:
          type: string
          format: uuid
          readOnly: true
        board:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        card:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - board
      - card
      - created_at
      - id
      - resource_id
      - workspace
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        card:
          type: string
          format: uuid
          readOnly: true
        original_name:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        uploaded_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - card
      - created_at
      - id
      - original_name
      - size
      - uploaded_by
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        full_name:
          type: string
        is_phone_verified:
          type: boolean
      required:
      - email
      - full_name
      - id
      - is_phone_verified
      - phone_number
    BoardDetailRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workspace_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/BoardVisibility'
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        current_user_role:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        lists:
          type: array
          items:
            $ref: '#/components/schemas/BoardListWithCardsRead'
          readOnly: true
      required:
      - created_at
      - created_by
      - current_user_role
      - id
      - lists
      - name
      - updated_at
      - workspace_id
    BoardListCreateRequest:
      type: object
      properties:
        title:
