          description: Invalid input; field errors or a list of validation messages.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                - type: object
                  additionalProperties:
                    oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
        '403':
          description: Insufficient permission or invalid CSRF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /api/auth/password/set/:
    post:
      operationId: auth_password_set_create
      description: |-
        Bearer token required. Sets the first password; existing passwords must use change. All sessions are revoked; sign in again with phone OTP.

        Validation errors return 400; throttling returns 429 with Retry-After. Code delivery failure returns 503. Never send refresh tokens in JSON.
      summary: Set optional login password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInitialPasswordRequest'
            example:
              password: use-a-strong-password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetInitialPasswordRequest'
            example:
              password: use-a-strong-password
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetInitialPasswordRequest'
            example:
              password: use-a-strong-password
        required: true
      security:
